name: PlayJolt Autonomous Candidate Cycle
on:
  push:
    branches:
      - 'commissioning/**'
    paths:
      - 'vibe-arcade/autonomy/commissioning/*/preflight-request.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Commissioning preflight-request.json path'
        required: true
        type: string
      recovery_run_id:
        description: 'Failed source run containing the durable provider checkpoint'
        required: false
        type: string
      recovery_attempt:
        description: 'Bounded retrieval-only recovery attempt'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: playjolt-auto-cycle-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix vibe-arcade/autonomy --ignore-scripts --no-audit --no-fund
      - name: Resolve explicitly authorized candidate
        id: resolve
        env:
          MANUAL_REQUEST: ${{ inputs.request_path }}
        run: |
          if [ -n "$MANUAL_REQUEST" ]; then
            REQUEST="$MANUAL_REQUEST"
          else
            REQUEST="$(git show --pretty='' --name-only "$GITHUB_SHA" | grep -E '^vibe-arcade/autonomy/commissioning/[^/]+/preflight-request\.json$' | head -n 1)"
          fi
          test -n "$REQUEST"
          META="$(node vibe-arcade/autonomy/cycle/resolve.cjs "$REQUEST")"
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "script=$(printf '%s' "$META" | jq -r '.commission_script')" >> "$GITHUB_OUTPUT"
          echo "game_id=$(printf '%s' "$META" | jq -r '.game_id')" >> "$GITHUB_OUTPUT"
          echo "candidate=$(printf '%s' "$META" | jq -r '.candidate')" >> "$GITHUB_OUTPUT"
          echo "usd_ceiling=$(printf '%s' "$META" | jq -r '.estimated_usd_ceiling')" >> "$GITHUB_OUTPUT"
          echo "provider_calls=$(printf '%s' "$META" | jq -r '.authorized_provider_calls')" >> "$GITHUB_OUTPUT"
          echo "FACTORY_WORKER_ROOT=$RUNNER_TEMP/playjolt-auto-cycle" >> "$GITHUB_ENV"
          echo "AUTO_PRODUCTION_SHIP=false" >> "$GITHUB_ENV"
      - name: Restore durable provider checkpoint
        if: ${{ inputs.recovery_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt }}
        run: |
          SOURCE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")"
          test "$(printf '%s' "$SOURCE" | jq -r '.name')" = "PlayJolt Autonomous Candidate Cycle"
          test "$(printf '%s' "$SOURCE" | jq -r '.path')" = ".github/workflows/playjolt-autonomous-cycle.yml"
          test "$(printf '%s' "$SOURCE" | jq -r '.event')" = "workflow_dispatch"
          test "$(printf '%s' "$SOURCE" | jq -r '.conclusion')" = "failure"
          test "$(printf '%s' "$SOURCE" | jq -r '.head_branch')" = "$GITHUB_REF_NAME"
          SOURCE_SHA="$(printf '%s' "$SOURCE" | jq -r '.head_sha')"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          gh run download "$RECOVERY_RUN_ID" \
            --name "playjolt-auto-cycle-${{ steps.resolve.outputs.game_id }}" \
            --dir "$FACTORY_WORKER_ROOT"
          node vibe-arcade/autonomy/cycle/recovery.cjs validate \
            "$FACTORY_WORKER_ROOT" "${{ steps.resolve.outputs.game_id }}" "${RECOVERY_ATTEMPT:-0}"
      - name: Announce autonomous cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="Autonomous cycle started: run_id=$GITHUB_RUN_ID game=${{ steps.resolve.outputs.game_id }} candidate=${{ steps.resolve.outputs.candidate }} provider_calls<=${{ steps.resolve.outputs.provider_calls }} cost<=USD${{ steps.resolve.outputs.usd_ceiling }} production=false."
          fi
      - name: Zero-paid preflight
        if: ${{ inputs.recovery_run_id == '' }}
        run: node "${{ steps.resolve.outputs.script }}" prepare
      - name: Verify reviewed contracts
        run: node "${{ steps.resolve.outputs.script }}" reviews
      - name: Build trusted Docker QA image
        run: |
          docker build --iidfile "$RUNNER_TEMP/qa-image" -f vibe-arcade/autonomy/isolation/Dockerfile vibe-arcade/autonomy
          echo "FACTORY_QA_IMAGE=$(cat "$RUNNER_TEMP/qa-image")" >> "$GITHUB_ENV"
      - name: Run bounded provider and repair loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FACTORY_OPENAI_MODEL: gpt-5.6-terra
          FACTORY_ALLOW_PAID_CALLS: '1'
        run: node "${{ steps.resolve.outputs.script }}" run
      - name: Preserve lifetime accounting
        if: always()
        run: |
          node "${{ steps.resolve.outputs.script }}" summarize || true
          node vibe-arcade/autonomy/control-plane/cli.cjs dashboard --root "$FACTORY_WORKER_ROOT" --policy "$FACTORY_WORKER_ROOT/control-policy.json" --provider-ready true || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playjolt-auto-cycle-${{ steps.resolve.outputs.game_id }}
          path: ${{ runner.temp }}/playjolt-auto-cycle
          include-hidden-files: true
          retention-days: 30
      - name: Preserve lightweight Foundry learning outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playjolt-learning-outcome-${{ steps.resolve.outputs.game_id }}
          path: ${{ runner.temp }}/playjolt-auto-cycle/commissioning-summary.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Recover durable provider response
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt }}
        run: |
          test -f "$FACTORY_WORKER_ROOT/worker-result.json" || exit 0
          PLAN="$(node vibe-arcade/autonomy/cycle/recovery.cjs plan \
            "$FACTORY_WORKER_ROOT" "${{ steps.resolve.outputs.game_id }}" "${RECOVERY_ATTEMPT:-0}")"
          if [ "$(printf '%s' "$PLAN" | jq -r '.recoverable')" != "true" ]; then
            echo "Provider recovery held: $(printf '%s' "$PLAN" | jq -r '.reason')."
            exit 0
          fi
          NEXT="$(printf '%s' "$PLAN" | jq -r '.next_attempt')"
          for ATTEMPT in 1 2 3; do
            if gh workflow run playjolt-autonomous-cycle.yml \
              --ref "$GITHUB_REF_NAME" \
              -f request_path="${{ steps.resolve.outputs.request }}" \
              -f recovery_run_id="$GITHUB_RUN_ID" \
              -f recovery_attempt="$NEXT"; then
              echo "Dispatched retrieval-only provider recovery $NEXT."
              exit 0
            fi
            sleep "$((ATTEMPT * 5))"
          done
          echo "Provider recovery dispatch failed after three attempts." >&2
          exit 1
      - name: Report terminal checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          FILE="$FACTORY_WORKER_ROOT/commissioning-summary.json"
          if [ -n "$PR" ] && [ -f "$FILE" ]; then
            STATE="$(jq -r '.factory.state // "UNKNOWN"' "$FILE")"
            VERSION="$(jq -r '.factory.version // "?"' "$FILE")"
            REPAIRS="$(jq -r '.factory.repair_attempt // "?"' "$FILE")"
            CALLS="$(jq -r '.total_calls // "?"' "$FILE")"
            COST="$(jq -r '.total_estimated_cost // "?"' "$FILE")"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="Autonomous cycle checkpoint: run_id=$GITHUB_RUN_ID state=$STATE version=$VERSION repair=$REPAIRS/5 provider_calls=$CALLS estimated_cost_usd=$COST production=false."
          fi
      - name: Handoff eligible RC to Preview and release packet
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$FACTORY_WORKER_ROOT/commissioning-summary.json"
          test -f "$FILE" || exit 0
          STATE="$(jq -r '.factory.state // "UNKNOWN"' "$FILE")"
          case "$STATE" in
            RC_READY|READY_TO_SHIP)
              for ATTEMPT in 1 2 3; do
                if gh workflow run playjolt-rc-release-packet.yml \
                  --ref main \
                  -f source_run_id="$GITHUB_RUN_ID"; then
                  echo "Terminal $STATE handed directly to RC Preview."
                  exit 0
                fi
                sleep "$((ATTEMPT * 5))"
              done
              echo "RC Preview dispatch failed after three attempts." >&2
              exit 1
              ;;
            *)
              echo "State $STATE is not Preview eligible."
              ;;
          esac
      - name: Handoff terminal candidate to queue supervisor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$FACTORY_WORKER_ROOT/commissioning-summary.json"
          if [ ! -f "$FILE" ]; then
            echo "No terminal commissioning summary; fail closed without advancing the queue."
            exit 0
          fi
          STATE="$(jq -r '.factory.state // "UNKNOWN"' "$FILE")"
          case "$STATE" in
            REJECTED|RC_READY|READY_TO_SHIP)
              gh workflow run playjolt-candidate-queue-supervisor.yml \
                --ref main \
                -f current_branch="$GITHUB_REF_NAME"
              echo "Terminal $STATE handed directly to the queue supervisor."
              ;;
            *)
              echo "Non-terminal state $STATE; queue continuation is intentionally held."
              ;;
          esac
