name: Fifth real candidate — bounded autonomous commissioning
on:
  push:
    branches: [commissioning/fifth-real-game-20260923]
    paths: ['vibe-arcade/autonomy/commissioning/fifth-real-game/run-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: playjolt-fifth-real-game-GAME-20260923-151
  cancel-in-progress: false
jobs:
  commission:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTO_PRODUCTION_SHIP: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix vibe-arcade/autonomy --ignore-scripts --no-audit --no-fund
      - name: All five trusted pre-paid gates
        run: node vibe-arcade/autonomy/commissioning/fifth-real-game/preflight.cjs
      - name: Pin trusted Docker QA image
        run: |
          docker build --iidfile "$RUNNER_TEMP/fifth-image" -f vibe-arcade/autonomy/isolation/Dockerfile vibe-arcade/autonomy
          echo "FACTORY_QA_IMAGE=$(cat "$RUNNER_TEMP/fifth-image")" >> "$GITHUB_ENV"
          echo "FACTORY_WORKER_ROOT=$RUNNER_TEMP/fifth-state" >> "$GITHUB_ENV"
      - name: Initialize one fresh isolated candidate, never a prior terminal ID
        run: node vibe-arcade/autonomy/commissioning/fifth-real-game/prepare.cjs
      - name: Actual provider and unchanged Technical Product Commercial Quality repair loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FACTORY_OPENAI_MODEL: gpt-5.6-terra
          FACTORY_ALLOW_PAID_CALLS: '1'
        run: node vibe-arcade/autonomy/commissioning/fifth-real-game/run.cjs
      - name: Preserve lifetime accounting and source provenance
        if: always()
        run: |
          node vibe-arcade/autonomy/commissioning/fifth-real-game/summarize.cjs
          node vibe-arcade/autonomy/commissioning/fifth-real-game/audit-provenance.cjs "$FACTORY_WORKER_ROOT"
          node vibe-arcade/autonomy/control-plane/cli.cjs dashboard --root "$FACTORY_WORKER_ROOT" --policy "$FACTORY_WORKER_ROOT/control-policy.json" --provider-ready true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifth-real-game-lifetime-checkpoint
          path: ${{ runner.temp }}/fifth-state
          include-hidden-files: true
          retention-days: 30
