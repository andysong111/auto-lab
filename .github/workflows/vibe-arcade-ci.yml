name: LoopJolt CI

on:
  push:
    paths:
      - 'vibe-arcade/**'
      - '.github/workflows/vibe-arcade-ci.yml'
  pull_request:
    paths:
      - 'vibe-arcade/**'
      - '.github/workflows/vibe-arcade-ci.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone JavaScript
        run: |
          node --check vibe-arcade/analytics.js
          node --check vibe-arcade/game-utils.js
          node --check vibe-arcade/api/event.js
      - name: Validate inline game scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          files = [
              Path('vibe-arcade/games/dont-press/index.html'),
              Path('vibe-arcade/games/perfect-timing/index.html'),
              Path('vibe-arcade/games/reaction-rush/index.html'),
          ]
          for path in files:
              text = path.read_text()
              scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.S|re.I)
              for i, script in enumerate(scripts):
                  tmp = Path(tempfile.gettempdir()) / f'{path.parent.name}-{i}.js'
                  tmp.write_text(script)
                  subprocess.run(['node','--check',str(tmp)], check=True)
          PY
      - name: Validate config
        run: python -m json.tool vibe-arcade/vercel.json > /dev/null
      - name: Start static server
        run: |
          python -m http.server 8765 --directory vibe-arcade >/tmp/loopjolt-http.log 2>&1 &
          echo $! > /tmp/loopjolt-http.pid
          sleep 1
      - name: Smoke routes
        run: |
          curl --fail http://127.0.0.1:8765/ | grep 'LOOPJOLT'
          curl --fail http://127.0.0.1:8765/games/dont-press/ | grep "Don't Press"
          curl --fail http://127.0.0.1:8765/games/perfect-timing/ | grep 'Perfect Timing'
          curl --fail http://127.0.0.1:8765/games/reaction-rush/ | grep 'Reaction Rush'
          curl --fail http://127.0.0.1:8765/game-utils.js | grep 'LoopJolt'
      - name: Validate source-of-truth
        run: |
          test -s vibe-arcade/GOALS.md
          grep 'Kill rule' vibe-arcade/GOALS.md
