name: LoopJolt ranked-game checks
on:
  pull_request:
    paths:
      - 'vibe-arcade/**'
      - 'loopjolt-backend/**'
      - '.github/workflows/loopjolt-ranked-ci.yml'
  push:
    branches: [main]
    paths:
      - 'vibe-arcade/**'
      - 'loopjolt-backend/**'
      - '.github/workflows/loopjolt-ranked-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic replay tests
        run: |
          for f in vibe-arcade/games/orbit-sprint/*.js vibe-arcade/community/*.js vibe-arcade/league/*.js; do node --check "$f"; done
          node --test vibe-arcade/tests/orbit-core.test.cjs
      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/loopjolt-browser" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/loopjolt-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Desktop and mobile smoke (mocked API, no external scores)
        run: NODE_PATH="$RUNNER_TEMP/loopjolt-browser/node_modules" node vibe-arcade/tests/browser-smoke.cjs
      - name: World League responsive navigation and data-state checks
        run: |
          NODE_PATH="$RUNNER_TEMP/loopjolt-browser/node_modules" node vibe-arcade/tests/league-browser.cjs
          NODE_PATH="$RUNNER_TEMP/loopjolt-browser/node_modules" node vibe-arcade/tests/league-nav-browser.cjs
      - name: Save visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-ui-qa
          path: league-qa/
          if-no-files-found: ignore
