name: PlayJolt Phaser Runtime Bootstrap
on:
  push:
    branches: ['factory/phaser-gamekit-v2-phase1']
    paths:
      - 'vibe-arcade/autonomy/gamekit/phaser-runtime.json'
      - 'vibe-arcade/autonomy/gamekit/fetch-phaser-runtime.cjs'
      - '.github/workflows/playjolt-phaser-runtime-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --prefix vibe-arcade/autonomy --ignore-scripts --no-audit --no-fund
      - name: Download and verify official Phaser runtime without executing it
        run: |
          node vibe-arcade/autonomy/gamekit/fetch-phaser-runtime.cjs "$RUNNER_TEMP/phaser-4.2.1.min.js"
          echo "FACTORY_PHASER_RUNTIME=$RUNNER_TEMP/phaser-4.2.1.min.js" >> "$GITHUB_ENV"
      - name: Install Chromium for the Phaser lane smoke
        run: vibe-arcade/autonomy/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser Phaser lane smoke
        run: npm run test:phaser --prefix vibe-arcade/autonomy
      - uses: actions/upload-artifact@v4
        with:
          name: phaser-4.2.1-runtime-pinned
          path: ${{ runner.temp }}/phaser-4.2.1.min.js
          retention-days: 7
