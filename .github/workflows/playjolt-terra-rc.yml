name: PlayJolt Terra canary RC preview

on:
  push:
    branches:
      - commissioning/terra-canary-20260922
    paths:
      - .github/workflows/playjolt-terra-rc.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: playjolt-terra-rc-20260922
  cancel-in-progress: false

jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIOR_RUN_ID: "35687897597"
      PRIOR_ARTIFACT: terra-repair2-canary-evidence
      GAME_ID: GAME-20260922-901
      VERSION: v3
      RC_BRANCH: factory/GAME-20260922-901-terra-canary
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore QA-passed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/terra-rc
          mkdir -p /tmp/terra-rc
          gh run download "$PRIOR_RUN_ID" -n "$PRIOR_ARTIFACT" -D /tmp/terra-rc
          test -d "/tmp/terra-rc/autonomy/games/$GAME_ID/$VERSION"
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('/tmp/terra-rc/autonomy/jobs/GAME-20260922-901/manifest.json','utf8'));
          const q=JSON.parse(fs.readFileSync('/tmp/terra-rc/autonomy/artifacts/GAME-20260922-901/v3/qa.json','utf8'));
          if(m.state!=='RC_READY'||m.version!=='v3'||m.qa_status!=='PASS'||m.quality_status!=='PASS')throw Error('candidate_not_rc_ready');
          if(q.passed!==true||(q.hard_failures||[]).length)throw Error('candidate_qa_not_clean');
          NODE

      - name: Create isolated candidate branch and draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "playjolt-factory"
          git config user.email "playjolt-factory@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$RC_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$RC_BRANCH" "origin/$RC_BRANCH"
          else
            git checkout -B "$RC_BRANCH" origin/main
          fi

          rm -rf "vibe-arcade/autonomy/games/$GAME_ID"
          mkdir -p "vibe-arcade/autonomy/games/$GAME_ID/$VERSION"
          cp -a "/tmp/terra-rc/autonomy/games/$GAME_ID/$VERSION/." "vibe-arcade/autonomy/games/$GAME_ID/$VERSION/"
          cat > "vibe-arcade/autonomy/games/$GAME_ID/COMMISSIONING.md" <<'DOC'
          # GPT-5.6 Terra real-provider commissioning candidate

          Unlisted fixture only. Not a production game.

          - Provider: GPT-5.6 Terra
          - Build + two targeted repairs
          - Final version: v3
          - Browser QA: PASS at 390x844, 768x1024, 1280x800
          - Quality gate: PASS (mechanical RC gate only)
          - Production shipping: disabled
          - Real model calls: 3
          - Cumulative estimated model cost: $0.16328201
          - Source evidence: GitHub Actions runs 35686518524, 35687383568, 35687897597
          DOC

          git add -f "vibe-arcade/autonomy/games/$GAME_ID"
          if ! git diff --cached --quiet; then
            git commit -m "feat(factory): add Terra canary RC $GAME_ID $VERSION"
            git push -u origin "$RC_BRANCH"
          fi

          existing="$(gh pr list --head "$RC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --draft --base main --head "$RC_BRANCH"               --title "Factory RC: Terra real-provider canary $GAME_ID $VERSION"               --body "Unlisted commissioning fixture generated by the real GPT-5.6 Terra provider. Three paid calls total (build + two targeted repairs), cumulative estimated model cost \$0.16328201. Final v3 passed Factory browser QA at all three viewports with hard failures 0 and reached RC_READY. This PR exists only to obtain an exact-source Vercel Preview and inspect the provider output. Do not merge into the production catalog. Production auto-ship remains disabled."
          fi

      - name: Print RC metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --head "$RC_BRANCH" --base main --state open --json number,url,isDraft,headRefName,headRefOid,title
