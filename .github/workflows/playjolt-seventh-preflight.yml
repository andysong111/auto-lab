name: PlayJolt Seventh Candidate Preflight
on:
  push:
    branches:
      - 'commissioning/seventh-real-game-20260924'
    paths:
      - 'vibe-arcade/autonomy/commissioning/seventh-real-game/preflight-request.json'

permissions:
  contents: read

concurrency:
  group: playjolt-seventh-preflight-GAME-20260924-171
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTO_PRODUCTION_SHIP: 'false'
      FACTORY_WORKER_ROOT: ${{ runner.temp }}/seventh-preflight
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix vibe-arcade/autonomy --ignore-scripts --no-audit --no-fund
      - name: Validate candidate graph and contracts
        run: |
          node vibe-arcade/autonomy/commissioning/seventh-real-game/commission.cjs prepare
      - name: Verify reviewed data
        run: |
          node vibe-arcade/autonomy/commissioning/seventh-real-game/commission.cjs reviews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seventh-real-game-preflight
          path: ${{ runner.temp }}/seventh-preflight
          include-hidden-files: true
          retention-days: 14
