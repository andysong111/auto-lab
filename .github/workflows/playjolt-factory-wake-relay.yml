name: PlayJolt Factory Wake Relay

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: playjolt-factory-wake-relay
  cancel-in-progress: false

jobs:
  wake-supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the guarded queue supervisor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run playjolt-candidate-queue-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Dispatched the guarded PlayJolt queue supervisor."
