name: PlayJolt Trusted Intake Generator
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate/materialize only; do not push or dispatch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: playjolt-trusted-intake-generator
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix vibe-arcade/autonomy --ignore-scripts --no-audit --no-fund
      - name: Verify owner-approved golden component baseline
        run: node vibe-arcade/autonomy/foundry/game-compiler.cjs verify
      - name: Enforce adaptive autonomous candidate quota
        if: ${{ inputs.dry_run != true }}
        id: quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE="$(date -u +%Y-%m-%dT00:00:00Z)"
          HISTORY="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playjolt-autonomous-cycle.yml/runs?per_page=100")"
          PROVEN="$(printf '%s' "$HISTORY" | jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and (.head_branch | startswith("commissioning/auto-")))] | unique_by(.head_branch) | length')"
          RAMP_CAP="$(node vibe-arcade/autonomy/cycle/ramp-policy.cjs cap "$PROVEN")"
          CAP="$(node vibe-arcade/autonomy/foundry/taste-calibration.cjs cap vibe-arcade/autonomy/foundry/taste-calibration.json "$RAMP_CAP")"
          COUNT="$(printf '%s' "$HISTORY" | jq --arg since "$SINCE" '[.workflow_runs[] | select(.created_at >= $since and (.head_branch | startswith("commissioning/auto-")))] | unique_by(.head_branch) | length')"
          ACTIVE="$(printf '%s' "$HISTORY" | jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"
          echo "proven=$PROVEN" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "An autonomous candidate is already active; intake remains idle."
          elif [ "$COUNT" -ge "$CAP" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Effective daily cap reached: $COUNT/$CAP after safety and owner-calibration policy."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile Factory learning and select the next design lane
        if: ${{ inputs.dry_run == true || steps.quota.outputs.allowed == 'true' }}
        id: foundry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTCOMES="$RUNNER_TEMP/playjolt-learning-outcomes"
          PROFILE="$RUNNER_TEMP/playjolt-learning-profile.json"
          PLAN="$RUNNER_TEMP/playjolt-foundry-selection.json"
          mkdir -p "$OUTCOMES"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playjolt-autonomous-cycle.yml/runs?status=completed&per_page=50" --jq '.workflow_runs[].id' | while read -r RUN_ID; do
            gh run download "$RUN_ID" --pattern 'playjolt-learning-outcome-*' --dir "$OUTCOMES/$RUN_ID" >/dev/null 2>&1 || true
          done
          node vibe-arcade/autonomy/foundry/learning.cjs compile \
            vibe-arcade/autonomy/foundry/seed-outcomes.json "$OUTCOMES" "$PROFILE"
          EXISTING="$(git ls-remote --heads origin 'refs/heads/commissioning/auto-*' | wc -l | tr -d ' ')"
          SEQUENCE="$((EXISTING + 1))"
          DATE_ISO="$(date -u +%Y-%m-%d)"
          node vibe-arcade/autonomy/foundry/selector.cjs select "$SEQUENCE" "$DATE_ISO" \
            vibe-arcade/autonomy/foundry/design-catalog.json \
            vibe-arcade/autonomy/foundry/benchmark-catalog.json "$PROFILE" \
            vibe-arcade/autonomy/foundry/taste-calibration.json > "$PLAN"
          echo "sequence=$SEQUENCE" >> "$GITHUB_OUTPUT"
          echo "lane=$(jq -r '.lane' "$PLAN")" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.status' "$PLAN")" = "SELECTED" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "design=$(jq -r '.design.id' "$PLAN")" >> "$GITHUB_OUTPUT"
            echo "Foundry selected $(jq -r '.design.id' "$PLAN") for the $(jq -r '.lane' "$PLAN") lane."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=$(jq -r '.reason' "$PLAN")" >> "$GITHUB_OUTPUT"
            echo "Foundry is safely idle: $(jq -r '.reason' "$PLAN"). No provider call will be made."
          fi
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
      - name: Materialize trusted candidate
        if: ${{ (inputs.dry_run == true || steps.quota.outputs.allowed == 'true') && steps.foundry.outputs.ready == 'true' }}
        id: materialize
        run: |
          DATE="$(date -u +%Y%m%d)"
          SEQUENCE="${{ steps.foundry.outputs.sequence }}"
          OUT="$RUNNER_TEMP/playjolt-intake"
          node vibe-arcade/autonomy/cycle/intake-generator.cjs materialize "$OUT" "$SEQUENCE" "$DATE" "${{ steps.foundry.outputs.plan }}"
          META="$OUT/meta.json"
          echo "branch=$(jq -r '.branch' "$META")" >> "$GITHUB_OUTPUT"
          echo "slot=$(jq -r '.slot' "$META")" >> "$GITHUB_OUTPUT"
          echo "candidate_dir=$(jq -r '.candidate_dir' "$META")" >> "$GITHUB_OUTPUT"
          echo "request=$(jq -r '.request_path' "$META")" >> "$GITHUB_OUTPUT"
          echo "game_id=$(jq -r '.game_id' "$META")" >> "$GITHUB_OUTPUT"
          echo "candidate=$(jq -r '.candidate' "$META")" >> "$GITHUB_OUTPUT"
          echo "signature=$(jq -r '.signature_id' "$META")" >> "$GITHUB_OUTPUT"
          echo "lane=$(jq -r '.lane' "$META")" >> "$GITHUB_OUTPUT"
          echo "family=$(jq -r '.family_id' "$META")" >> "$GITHUB_OUTPUT"
      - name: Stage generated candidate in isolated branch
        if: ${{ (inputs.dry_run == true || steps.quota.outputs.allowed == 'true') && steps.foundry.outputs.ready == 'true' }}
        run: |
          BRANCH="${{ steps.materialize.outputs.branch }}"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch already exists: $BRANCH"
            exit 2
          fi
          git config user.name "playjolt-factory[bot]"
          git config user.email "playjolt-factory@users.noreply.github.com"
          git checkout -b "$BRANCH"
          TARGET="${{ steps.materialize.outputs.candidate_dir }}"
          mkdir -p "$TARGET"
          cp -R "$RUNNER_TEMP/playjolt-intake/candidate/." "$TARGET/"
          node vibe-arcade/autonomy/cycle/resolve.cjs "${{ steps.materialize.outputs.request }}"
          git add "$TARGET"
          git commit -m "Stage autonomous candidate ${{ steps.materialize.outputs.game_id }}"
      - name: Zero-paid generated-candidate preflight
        if: ${{ (inputs.dry_run == true || steps.quota.outputs.allowed == 'true') && steps.foundry.outputs.ready == 'true' }}
        env:
          FACTORY_WORKER_ROOT: ${{ runner.temp }}/generated-preflight
          AUTO_PRODUCTION_SHIP: 'false'
        run: |
          node "${{ steps.materialize.outputs.candidate_dir }}/commission.cjs" prepare
          node "${{ steps.materialize.outputs.candidate_dir }}/commission.cjs" reviews
      - name: Stop after dry-run validation
        if: ${{ inputs.dry_run == true && steps.foundry.outputs.ready == 'true' }}
        run: |
          echo "Dry run passed for ${{ steps.materialize.outputs.game_id }} / ${{ steps.materialize.outputs.candidate }}"
      - name: Push reviewed candidate branch
        if: ${{ inputs.dry_run != true && steps.quota.outputs.allowed == 'true' && steps.foundry.outputs.ready == 'true' }}
        run: git push origin "${{ steps.materialize.outputs.branch }}"
      - name: Open draft candidate PR (best effort)
        if: ${{ inputs.dry_run != true && steps.quota.outputs.allowed == 'true' && steps.foundry.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --draft --base main --head "${{ steps.materialize.outputs.branch }}" \
            --title "Autonomous candidate: ${{ steps.materialize.outputs.candidate }}" \
            --body "Trusted Foundry candidate. Game: ${{ steps.materialize.outputs.game_id }}. Lane: ${{ steps.materialize.outputs.lane }}. Family: ${{ steps.materialize.outputs.family }}. Design: ${{ steps.materialize.outputs.signature }}. Provider calls <=6, estimated model cost <=USD2, Production=false."
      - name: Dispatch bounded autonomous cycle
        if: ${{ inputs.dry_run != true && steps.quota.outputs.allowed == 'true' && steps.foundry.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run playjolt-autonomous-cycle.yml \
            --ref "${{ steps.materialize.outputs.branch }}" \
            -f request_path="${{ steps.materialize.outputs.request }}"
