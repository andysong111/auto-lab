name: Astra P2 release candidate
on:
  push:
    branches: [preview/astra-polish]
  pull_request:
    paths: ['vibe-arcade/preview/astra-polish/**', 'vibe-arcade/scripts/build-astra-polish*.cjs', 'vibe-arcade/scripts/build-astra-release.cjs', 'vibe-arcade/tests/astra-polish-*', 'vibe-arcade/tests/astra-release.test.cjs', 'vibe-arcade/vercel.json', '.github/workflows/astra-polish-preview.yml']
permissions:
  contents: read
concurrency:
  group: astra-polish-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P2 geometry, fair warnings, difficulty probes and unchanged production
        run: |
          node vibe-arcade/scripts/build-astra-polish.cjs
          QA_OUT=/tmp/astra-polish/probes node --test vibe-arcade/tests/astra-polish-core.test.cjs vibe-arcade/tests/astra-core.test.cjs vibe-arcade/tests/astra-package.test.cjs\n          node vibe-arcade/scripts/build-astra-release.cjs\n          node --test vibe-arcade/tests/astra-release.test.cjs
      - name: Browser checker, test dependency only
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.55.0 --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: P2 full campaign, pointer/dash/upgrade inputs, four viewport widths
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" QA_OUT=/tmp/astra-polish/full node vibe-arcade/tests/astra-polish-browser.cjs
      - name: Normal-clock native routes, touch, sound and pause
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" QA_OUT=/tmp/astra-polish/routes node vibe-arcade/tests/astra-polish-browser.cjs --routes
      - name: Record reviewed source and generated candidate identity
        run: |
          mkdir -p /tmp/astra-polish/source /tmp/astra-polish/playable
          cp -r vibe-arcade/preview/astra-polish /tmp/astra-polish/source/
          cp vibe-arcade/scripts/build-astra-polish*.cjs /tmp/astra-polish/source/
          cp -r vibe-arcade/labs/astra-sentinel/. /tmp/astra-polish/playable/\n          mkdir -p /tmp/astra-polish/release && cp -r vibe-arcade/release/astra-sentinel/. /tmp/astra-polish/release/
          git rev-parse HEAD > /tmp/astra-polish/source-commit.txt
          find vibe-arcade/labs/astra-sentinel -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/astra-polish/candidate-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-polish-review-evidence
          path: /tmp/astra-polish
          retention-days: 7
