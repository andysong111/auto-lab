name: PlayJolt third candidate read-only motion audit
# Also run the complete product suite with bounded native media-event settlement; preserve terminal state.
on:
  push:
    branches: [commissioning/third-real-game-20260922]
    paths: ['.github/workflows/playjolt-third-motion-audit.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: playjolt-third-motion-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix vibe-arcade/autonomy --ignore-scripts --no-audit --no-fund
      - name: Restore exhausted terminal checkpoint (no provider key)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "FACTORY_WORKER_ROOT=$RUNNER_TEMP/third-motion-audit" >> "$GITHUB_ENV"
          gh run download 35732729905 -n third-real-game-GAME-20260922-131 -D "$RUNNER_TEMP/third-motion-audit"
      - name: Verify real source provenance and provider feedback
        run: |
          node vibe-arcade/autonomy/commissioning/third-real-game/audit-provenance.cjs "$FACTORY_WORKER_ROOT"
          node vibe-arcade/autonomy/commissioning/third-real-game/audit-feedback.cjs "$FACTORY_WORKER_ROOT"
      - name: Build pinned isolated audit runtime
        run: |
          docker build --iidfile "$RUNNER_TEMP/motion-audit-image" -f vibe-arcade/autonomy/isolation/Dockerfile vibe-arcade/autonomy
          echo "FACTORY_QA_IMAGE=$(cat "$RUNNER_TEMP/motion-audit-image")" >> "$GITHUB_ENV"
      - name: Record media-event timing without modifying the rejected job
        run: node vibe-arcade/autonomy/commissioning/third-real-game/audit-motion.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-candidate-motion-audit
          path: ${{ runner.temp }}/third-motion-audit
          include-hidden-files: true
          retention-days: 30
