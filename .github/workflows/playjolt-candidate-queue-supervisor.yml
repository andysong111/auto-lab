name: PlayJolt Candidate Queue Supervisor
on:
  workflow_run:
    workflows:
      - 'PlayJolt Autonomous Candidate Cycle'
      - 'PlayJolt Ninth Candidate Commissioning'
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      current_branch:
        description: 'Completed commissioning branch'
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: playjolt-candidate-queue-supervisor
  cancel-in-progress: false

jobs:
  advance:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve continuation
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BRANCH: ${{ inputs.current_branch }}
          COMPLETED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          CURRENT="${MANUAL_BRANCH:-$COMPLETED_BRANCH}"
          if [ -z "$CURRENT" ]; then
            LATEST="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playjolt-autonomous-cycle.yml/runs?status=completed&per_page=100" --jq '.workflow_runs[0] | [.head_branch,.conclusion,.head_sha] | @tsv')"
            CURRENT="$(printf '%s' "$LATEST" | cut -f1)"
            CONCLUSION="$(printf '%s' "$LATEST" | cut -f2)"
            if [ -n "$CURRENT" ] && [ "$CONCLUSION" != "success" ]; then
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "needs_intake=false" >> "$GITHUB_OUTPUT"
              echo "Latest autonomous cycle on $CURRENT did not complete successfully; holding automatic continuation."
              exit 0
            fi
          fi
          if [ -z "$CURRENT" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "needs_intake=true" >> "$GITHUB_OUTPUT"
            echo "No prior cycle found; trusted intake may bootstrap the first dynamic candidate."
            exit 0
          fi
          CONT="$(node vibe-arcade/autonomy/cycle/queue.cjs continue "$CURRENT")"
          MODE="$(printf '%s' "$CONT" | jq -r '.mode')"
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "intake" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "needs_intake=true" >> "$GITHUB_OUTPUT"
            echo "reason=$(printf '%s' "$CONT" | jq -r '.reason')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "needs_intake=false" >> "$GITHUB_OUTPUT"
          echo "branch=$(printf '%s' "$CONT" | jq -r '.next.branch')" >> "$GITHUB_OUTPUT"
          echo "request=$(printf '%s' "$CONT" | jq -r '.next.request_path')" >> "$GITHUB_OUTPUT"
          echo "game_id=$(printf '%s' "$CONT" | jq -r '.next.game_id')" >> "$GITHUB_OUTPUT"
          echo "candidate=$(printf '%s' "$CONT" | jq -r '.next.candidate')" >> "$GITHUB_OUTPUT"
      - name: Refuse duplicate run for unchanged queued candidate SHA
        if: steps.next.outputs.available == 'true'
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.next.outputs.branch }}
        run: |
          TARGET_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test -n "$TARGET_SHA"
          EXISTING="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/playjolt-autonomous-cycle.yml/runs" -f branch="$TARGET_BRANCH" -f per_page=100 --jq "[.workflow_runs[] | select(.head_sha == \"$TARGET_SHA\")] | length")"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EXISTING" -gt 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Candidate $TARGET_BRANCH at $TARGET_SHA already has an autonomous-cycle run; waiting for a new reviewed commit."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce one new candidate per UTC day
        if: ${{ steps.next.outputs.needs_intake == 'true' || (steps.next.outputs.available == 'true' && steps.freshness.outputs.eligible == 'true') }}
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE="$(date -u +%Y-%m-%dT00:00:00Z)"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playjolt-autonomous-cycle.yml/runs?per_page=100" --jq "[.workflow_runs[] | select(.created_at >= \"$SINCE\")] | length")"
          if [ "$COUNT" -ge 1 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Daily candidate cap reached; continuation remains queued for a later scheduled supervisor pass."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Limit trusted intake to one attempt per UTC day
        if: steps.next.outputs.needs_intake == 'true' && steps.daily.outputs.allowed == 'true'
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE="$(date -u +%Y-%m-%dT00:00:00Z)"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playjolt-intake-generator.yml/runs?per_page=100" --jq "[.workflow_runs[] | select(.created_at >= \"$SINCE\")] | length")"
          if [ "$COUNT" -ge 1 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Trusted intake already attempted today; waiting for the next UTC day."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch next reviewed queued candidate
        if: steps.next.outputs.available == 'true' && steps.freshness.outputs.eligible == 'true' && steps.daily.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run playjolt-autonomous-cycle.yml \
            --ref "${{ steps.next.outputs.branch }}" \
            -f request_path="${{ steps.next.outputs.request }}"
          echo "Dispatched ${{ steps.next.outputs.game_id }} / ${{ steps.next.outputs.candidate }} on ${{ steps.next.outputs.branch }}"
      - name: Generate next trusted candidate when queue is exhausted
        if: steps.next.outputs.needs_intake == 'true' && steps.daily.outputs.allowed == 'true' && steps.intake.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run playjolt-intake-generator.yml --ref main
          echo "Static reviewed queue exhausted; dispatched trusted intake generator."
