name: PlayJolt first real game commissioning
on:
  push:
    branches: [commissioning/first-real-game-20260922]
    paths: ['vibe-arcade/autonomy/commissioning/first-real-game/run-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: playjolt-first-real-game-GAME-20260922-110
  cancel-in-progress: false
jobs:
  commissioning:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FACTORY_WORKER_ROOT: ${{ runner.temp }}/playjolt-first-real-game
      FACTORY_OPENAI_MODEL: gpt-5.6-terra
      FACTORY_ALLOW_PAID_CALLS: '1'
      AUTO_PRODUCTION_SHIP: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject duplicate commissioning submissions before exposing the provider secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/playjolt-first-real-game.yml/runs?branch=commissioning%2Ffirst-real-game-20260922&per_page=100" --jq '.workflow_runs[].id' > "$RUNNER_TEMP/prior-commissioning-runs"
          node -e 'const fs=require("node:fs");const ids=fs.readFileSync(process.env.RUNNER_TEMP+"/prior-commissioning-runs","utf8").trim().split(/\s+/);if(ids.some(id=>id!==process.env.GITHUB_RUN_ID))throw Error("prior_commissioning_exists_restore_ledger_do_not_resubmit");'
      - run: npm ci --prefix vibe-arcade/autonomy --ignore-scripts --no-audit --no-fund
      - name: Verify commissioning contracts before paid generation
        run: node --test vibe-arcade/autonomy/commissioning/tests/*.test.cjs
      - name: Spec Gate and isolated state
        run: |
          node vibe-arcade/autonomy/commissioning/cli.cjs check-spec vibe-arcade/autonomy/commissioning/first-real-game/proposal.json
          node vibe-arcade/autonomy/commissioning/first-real-game/prepare.cjs
          node vibe-arcade/autonomy/cli.cjs create --root "$FACTORY_WORKER_ROOT" --spec "$FACTORY_WORKER_ROOT/factory-spec.json"
      - name: Build reviewed isolated browser image
        run: |
          docker build --iidfile "$RUNNER_TEMP/first-game-image" -f vibe-arcade/autonomy/isolation/Dockerfile vibe-arcade/autonomy
          echo "FACTORY_QA_IMAGE=$(cat "$RUNNER_TEMP/first-game-image")" >> "$GITHUB_ENV"
      - name: Real Terra build and bounded AI repair through the existing Worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          node vibe-arcade/autonomy/worker.cjs run-once --root "$FACTORY_WORKER_ROOT" --policy "$FACTORY_WORKER_ROOT/control-policy.json" --config "$FACTORY_WORKER_ROOT/worker-config.json" | tee "$FACTORY_WORKER_ROOT/worker-result.json"
      - name: Record all operations and terminal Factory result
        if: always()
        run: node vibe-arcade/autonomy/commissioning/first-real-game/summarize.cjs
      - name: Preserve exact sources, QA screenshots and durable provider ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-real-game-GAME-20260922-110
          path: ${{ runner.temp }}/playjolt-first-real-game
          include-hidden-files: true
          retention-days: 30
