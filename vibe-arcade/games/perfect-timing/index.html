<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfect Timing — LoopJolt</title><meta name="description" content="Stop the marker at the exact center. Can you hit 100%?"><link rel="stylesheet" href="/styles.css"></head><body><div class="game-shell"><div class="game-top"><a class="brand" href="/">← LOOPJOLT</a><span class="pill">Precision game</span></div><main class="game-card"><h1>Perfect Timing</h1><p class="muted">Stop exactly in the center. Three rounds.</p><div class="stat-row"><div class="stat"><span>Round</span><b id="round">0/3</b></div><div class="stat"><span>Best</span><b id="best">—</b></div></div><div class="timing-track" id="track"><div class="sweet"></div><div class="timing-dot" id="dot"></div></div><button class="primary" id="action">Start</button><div class="result" id="result"></div><div class="actions"><button class="secondary" id="share">Share</button><a class="secondary" href="/games/reaction-rush/" id="next">Next game →</a></div></main></div><script src="/analytics.js"></script><script>const A=window.VibeAnalytics,dot=document.querySelector('#dot'),action=document.querySelector('#action'),roundEl=document.querySelector('#round'),bestEl=document.querySelector('#best'),result=document.querySelector('#result');let active=false,startTs=0,raf=0,round=0,scores=[];function pos(){const elapsed=(performance.now()-startTs)/1000;return (Math.sin(elapsed*4.5-Math.PI/2)+1)/2}function frame(){const p=pos();dot.style.left=(p*100)+'%';raf=requestAnimationFrame(frame)}function begin(){round=0;scores=[];bestEl.textContent='—';result.textContent='';A.track(action.dataset.played?'replay':'game_start',{game:'perfect-timing'});action.dataset.played='1';nextRound()}function nextRound(){round++;roundEl.textContent=round+'/3';active=true;startTs=performance.now();cancelAnimationFrame(raf);frame();action.textContent='STOP'}function stop(){if(!active)return;active=false;cancelAnimationFrame(raf);const p=pos(),distance=Math.abs(.5-p),score=Math.max(0,Math.round((1-distance/.5)*1000)/10);scores.push(score);bestEl.textContent=Math.max(...scores).toFixed(1)+'%';result.textContent=score>=99?'Almost impossible. '+score.toFixed(1)+'%':score.toFixed(1)+'% accuracy';if(round<3){action.textContent='Next round'}else{const avg=scores.reduce((a,b)=>a+b,0)/scores.length;action.textContent='Play again';result.textContent='Average '+avg.toFixed(1)+'% · Best '+Math.max(...scores).toFixed(1)+'%';A.track('game_finish',{game:'perfect-timing',avg:+avg.toFixed(1),best:+Math.max(...scores).toFixed(1)});round=0}}action.onclick=()=>{if(active)stop();else if(round===0)begin();else nextRound()};document.querySelector('#share').onclick=async()=>{A.track('share',{game:'perfect-timing'});if(navigator.share)await navigator.share({title:'Perfect Timing',text:'Try to beat my timing.',url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href)};document.querySelector('#next').onclick=()=>A.track('next_game',{from:'perfect-timing',to:'reaction-rush'});A.track('game_open',{game:'perfect-timing'});</script></body></html>
