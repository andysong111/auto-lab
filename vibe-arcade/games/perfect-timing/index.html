<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Perfect Timing — LoopJolt</title>
  <meta name="description" content="Stop the marker at the exact center. Can you hit 100%?">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="game-shell">
    <div class="game-top">
      <a class="brand" href="/">← LOOPJOLT</a>
      <span class="pill">Precision game · v2</span>
    </div>
    <main class="game-card">
      <h1>Perfect Timing</h1>
      <p class="muted">Three rounds. Faster marker. Smaller target. Hit the center.</p>
      <div class="stat-row">
        <div class="stat"><span>Round</span><b id="round">0/3</b></div>
        <div class="stat"><span>Last</span><b id="last">—</b></div>
        <div class="stat"><span>PB</span><b id="best">—</b></div>
      </div>
      <div class="timing-track" id="track">
        <div class="sweet" id="sweet"></div>
        <div class="timing-dot" id="dot"></div>
      </div>
      <div class="combo" id="difficulty">Round 1: generous target</div>
      <button class="primary" id="action">Start</button>
      <div class="result" id="result"></div>
      <div class="actions">
        <button class="secondary" id="share">Share</button>
        <a class="secondary" href="/games/reaction-rush/" id="next">Next game →</a>
      </div>
    </main>
  </div>
  <script src="/analytics.js"></script>
  <script src="/game-utils.js"></script>
  <script>
    const A=window.VibeAnalytics,L=window.LoopJolt;
    const dot=document.querySelector('#dot'),track=document.querySelector('#track'),sweet=document.querySelector('#sweet');
    const action=document.querySelector('#action'),roundEl=document.querySelector('#round'),lastEl=document.querySelector('#last');
    const bestEl=document.querySelector('#best'),result=document.querySelector('#result'),difficulty=document.querySelector('#difficulty');
    let active=false,startTs=0,raf=0,round=0,scores=[];
    const speeds=[3.8,5.2,6.8],zones=[12,7,3.5];
    const labels=['generous target','tighter target','needle-eye target'];
    const storedBest=Number(localStorage.getItem('loopjolt_best_perfect_timing')||0);
    bestEl.textContent=storedBest?storedBest.toFixed(1)+'%':'—';

    function pos(){
      const elapsed=(performance.now()-startTs)/1000;
      return (Math.sin(elapsed*speeds[Math.max(0,round-1)]-Math.PI/2)+1)/2;
    }
    function frame(){
      dot.style.left=(pos()*100)+'%';
      raf=requestAnimationFrame(frame);
    }
    function styleRound(){
      const zone=zones[round-1];
      sweet.style.width=zone+'%';sweet.style.left=(50-zone/2)+'%';
      difficulty.textContent='Round '+round+': '+labels[round-1]+' · speed '+speeds[round-1].toFixed(1)+'x';
    }
    function begin(){
      round=0;scores=[];lastEl.textContent='—';result.textContent='';
      A.track(action.dataset.played?'replay':'game_start',{game:'perfect-timing'});action.dataset.played='1';
      nextRound();
    }
    function nextRound(){
      round++;roundEl.textContent=round+'/3';active=true;startTs=performance.now();
      cancelAnimationFrame(raf);styleRound();frame();action.textContent='STOP';
      L.sound('tap');
    }
    function stop(){
      if(!active)return;
      active=false;cancelAnimationFrame(raf);
      const p=pos(),distance=Math.abs(.5-p);
      const score=Math.max(0,Math.round((1-distance/.5)*1000)/10);
      scores.push(score);lastEl.textContent=score.toFixed(1)+'%';
      lastEl.classList.remove('score-pop');void lastEl.offsetWidth;lastEl.classList.add('score-pop');
      const rect=dot.getBoundingClientRect();

      if(score>=99){
        result.textContent='PERFECT-ish · '+score.toFixed(1)+'%';
        L.sound('perfect');L.haptic([18,20,18]);L.burstAt(rect.left+rect.width/2,rect.top+rect.height/2,22);
        track.classList.add('flash-good');setTimeout(()=>track.classList.remove('flash-good'),380);
      }else if(score>=94){
        result.textContent='Clean hit · '+score.toFixed(1)+'%';L.sound('good');L.haptic(16);L.burstAt(rect.left+rect.width/2,rect.top+rect.height/2,10);
      }else{
        result.textContent=score.toFixed(1)+'% · you can do better';L.sound('tap');
      }

      if(round<3){
        action.textContent='Next round';
      }else{
        const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
        const runBest=Math.max(...scores);
        const pb=L.localBest('perfect_timing',runBest,'max');
        bestEl.textContent=pb.toFixed(1)+'%';
        action.textContent='Play again';
        result.textContent='Average '+avg.toFixed(1)+'% · Best '+runBest.toFixed(1)+'%'+(runBest>=pb?' · PB':'');
        if(avg>=95){L.sound('perfect');L.burstElement(action,28)}
        A.track('game_finish',{game:'perfect-timing',avg:+avg.toFixed(1),best:+runBest.toFixed(1),scores});
        round=0;
      }
    }
    function press(){if(active)stop();else if(round===0)begin();else nextRound()}
    action.addEventListener('click',press);
    window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();press()}});
    document.querySelector('#share').addEventListener('click',async()=>{
      A.track('share',{game:'perfect-timing'});
      if(navigator.share)await navigator.share({title:'Perfect Timing',text:'Try to beat my timing.',url:location.href}).catch(()=>{});
      else L.toast('Copy this page URL to share');
    });
    document.querySelector('#next').addEventListener('click',()=>A.track('next_game',{from:'perfect-timing',to:'reaction-rush'}));
    A.track('game_open',{game:'perfect-timing'});
  </script>
</body>
</html>
