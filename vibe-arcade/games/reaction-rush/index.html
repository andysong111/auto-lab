<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Rush — Vibe Arcade</title><meta name="description" content="Thirty seconds. Hit as many targets as you can."><link rel="stylesheet" href="/styles.css"></head><body><div class="game-shell"><div class="game-top"><a class="brand" href="/">← VIBE ARCADE</a><span class="pill">Reflex game</span></div><main class="game-card"><h1>Reaction Rush</h1><p class="muted">30 seconds. Hit every target you can.</p><div class="stat-row"><div class="stat"><span>Time</span><b id="time">30.0</b></div><div class="stat"><span>Score</span><b id="score">0</b></div><div class="stat"><span>Avg</span><b id="avg">—</b></div></div><div class="arena" id="arena"><button class="target" id="target" hidden>HIT</button></div><div class="result" id="result"></div><div class="actions"><button class="primary" id="start">Start</button><button class="secondary" id="share">Share</button><a class="secondary" href="/games/dont-press/" id="next">Next game →</a></div></main></div><script src="/analytics.js"></script><script>const A=window.VibeAnalytics,arena=document.querySelector('#arena'),target=document.querySelector('#target'),start=document.querySelector('#start'),time=document.querySelector('#time'),scoreEl=document.querySelector('#score'),avgEl=document.querySelector('#avg'),result=document.querySelector('#result');let running=false,endAt=0,timer,score=0,lastSpawn=0,times=[];function place(){const x=Math.random()*(arena.clientWidth-target.offsetWidth-16)+8,y=Math.random()*(arena.clientHeight-target.offsetHeight-16)+8;target.style.left=x+'px';target.style.top=y+'px';lastSpawn=performance.now()}function finish(){running=false;clearInterval(timer);target.hidden=true;const avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;avgEl.textContent=avg?Math.round(avg)+'ms':'—';result.textContent=`${score} hits · ${avg?Math.round(avg):'—'}ms average reaction`;start.textContent='Play again';A.track('game_finish',{game:'reaction-rush',score,avg_ms:Math.round(avg)})}function play(){clearInterval(timer);running=true;score=0;times=[];scoreEl.textContent='0';avgEl.textContent='—';result.textContent='';endAt=performance.now()+30000;target.hidden=false;place();start.textContent='Restart';A.track(start.dataset.played?'replay':'game_start',{game:'reaction-rush'});start.dataset.played='1';timer=setInterval(()=>{const left=(endAt-performance.now())/1000;time.textContent=Math.max(0,left).toFixed(1);if(left<=0)finish()},50)}target.onclick=()=>{if(!running)return;times.push(performance.now()-lastSpawn);score++;scoreEl.textContent=score;place()};start.onclick=play;document.querySelector('#share').onclick=async()=>{A.track('share',{game:'reaction-rush'});if(navigator.share)await navigator.share({title:'Reaction Rush',text:'Beat my reaction score.',url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href)};document.querySelector('#next').onclick=()=>A.track('next_game',{from:'reaction-rush',to:'dont-press'});A.track('game_open',{game:'reaction-rush'});</script></body></html>
