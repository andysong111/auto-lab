<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Don't Press — Vibe Arcade</title><meta name="description" content="Can you resist pressing the red button for 30 seconds?"><link rel="stylesheet" href="/styles.css"></head><body><div class="game-shell"><div class="game-top"><a class="brand" href="/">← VIBE ARCADE</a><span class="pill">Curiosity test</span></div><main class="game-card"><h1>Don't Press</h1><p class="muted" id="subtitle">Survive 30 seconds without touching the red button.</p><div class="stat-row"><div class="stat"><span>Time</span><b id="time">30.0</b></div><div class="stat"><span>Status</span><b id="status">READY</b></div></div><div class="arena" id="arena"><button class="danger-button" id="danger" style="left:35%;top:42%">DO NOT PRESS</button></div><div class="result" id="result"></div><div class="actions"><button class="primary" id="start">Start</button><button class="secondary" id="share">Share</button><a class="secondary" href="/games/perfect-timing/" id="next">Next game →</a></div></main></div><script src="/analytics.js"></script><script>const A=window.VibeAnalytics,arena=document.querySelector('#arena'),btn=document.querySelector('#danger'),start=document.querySelector('#start'),time=document.querySelector('#time'),status=document.querySelector('#status'),result=document.querySelector('#result');let running=false,t=30,interval,moves=0;const lines=['PRESS ME','JUST ONCE','NOTHING BAD HAPPENS','YOU ARE CURIOUS','LAST CHANCE','DO NOT PRESS'];function move(){const maxX=arena.clientWidth-btn.offsetWidth-12,maxY=arena.clientHeight-btn.offsetHeight-12;btn.style.left=Math.max(8,Math.random()*maxX)+'px';btn.style.top=Math.max(8,Math.random()*maxY)+'px';btn.textContent=lines[Math.floor(Math.random()*lines.length)];moves++}function finish(won){running=false;clearInterval(interval);status.textContent=won?'WIN':'FAILED';result.textContent=won?'You resisted. That is rarer than it should be.':'You pressed it. Of course you did.';start.textContent='Play again';A.track('game_finish',{game:'dont-press',won,moves,seconds:won?30:+(30-t).toFixed(1)})}function play(){clearInterval(interval);running=true;t=30;moves=0;result.textContent='';status.textContent='HOLD';start.textContent='Restart';move();A.track(start.dataset.played?'replay':'game_start',{game:'dont-press'});start.dataset.played='1';interval=setInterval(()=>{t-=.1;time.textContent=Math.max(0,t).toFixed(1);if(Math.random()<.09)move();if(t<=0)finish(true)},100)}start.onclick=play;btn.onclick=()=>{if(running)finish(false)};document.querySelector('#share').onclick=async()=>{A.track('share',{game:'dont-press'});const data={title:'Don\'t Press',text:'Can you survive 30 seconds without pressing it?',url:location.href};if(navigator.share)await navigator.share(data).catch(()=>{});else navigator.clipboard?.writeText(location.href)};document.querySelector('#next').onclick=()=>A.track('next_game',{from:'dont-press',to:'perfect-timing'});A.track('game_open',{game:'dont-press'});</script></body></html>
