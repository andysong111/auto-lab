<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="style.css"><title>Commercial infrastructure fixture</title></head><body><main>
<h1>Signal panels</h1><p data-objective>Match the lit target in all 3 panels</p><p data-product-progress>PANELS 0 / 3</p>
<div class="scores"><div><b data-score-label>CURRENT SCORE</b><output data-game-score>0</output></div><div><b data-best-label>DEVICE BEST</b><output data-best>0</output></div></div>
<canvas data-game-canvas tabindex="0" aria-label="Toggle matching panels"></canvas>
<p data-result hidden></p><p data-replay-reason>Replay to find a cleaner sequence and clear every panel.</p>
<button data-game-restart hidden>Replay panels</button><div class="controls"><button data-game-start>Start</button><button data-game-pause hidden>Pause</button><button data-game-resume hidden>Resume</button><button data-mute aria-pressed="false">Sound on</button></div>
<p data-game-status>Ready</p><span data-game-progress hidden>0</span><p data-game-error hidden></p><p class="density" hidden></p>
</main><script src="core.js"></script><script src="gamekit.js"></script><script src="view/art.js"></script><script src="app.js"></script></body></html>
