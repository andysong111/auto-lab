<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Halo Guard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">PLAYJOLT / TOY SKY DEFENSE</p>
      <h1>HALO GUARD</h1>
      <p data-objective>Rotate the halo to rescue wisps and keep shard raiders outside the core.</p>
    </header>
    <section class="hud" aria-label="Defense status">
      <div class="stat progress"><b>RESCUED</b><span data-game-progress data-progress-value>0 RESCUED</span></div>
      <div class="stat"><b data-score-label>CURRENT SCORE</b><span data-game-score>0</span></div>
      <div class="stat"><b data-best-label>DEVICE BEST</b><span data-game-best>0</span></div>
    </section>
    <section class="stage" aria-label="Halo Guard defense arena">
      <canvas data-game-canvas tabindex="0" aria-label="Drag around the arena or use arrow keys to rotate the halo"></canvas>
      <div class="result" data-result-title aria-live="polite"></div>
    </section>
    <div class="controls" aria-label="Game controls">
      <button type="button" data-game-start>PLAY</button>
      <button type="button" data-game-pause>PAUSE</button>
      <button type="button" data-game-resume>RESUME</button>
      <button type="button" data-game-restart>REPLAY</button>
      <button type="button" data-game-mute data-mute>SOUND ON</button>
    </div>
    <div data-game-status aria-live="polite">Ready to guard the sky citadel.</div>
    <div data-replay-reason>Replay the same defense seed to rescue more wisps, preserve barriers and improve the device best.</div>
    <div data-game-error hidden role="alert"></div>
  </main>
  <script src="./feelaudio.js"></script>
  <script src="./halo-guard-core.js"></script>
  <script src="./radialkit.js"></script>
  <script src="./core.js"></script>
  <script src="./gamekit.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
