<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prism Relay</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <canvas data-game-canvas tabindex="0" aria-label="Prism Relay game board"></canvas>
    <section class="readout" aria-label="Game status">
      <span data-game-status>Ready to relay light.</span>
      <span>Score: <b data-game-score>0</b></span>
      <span>Progress: <b data-game-progress>0%</b></span>
    </section>
    <section class="controls" aria-label="Game controls">
      <button type="button" data-game-start>Start Relay</button>
      <button type="button" data-game-pause>Pause</button>
      <button type="button" data-game-resume>Resume</button>
      <button type="button" data-game-restart>Play Again</button>
    </section>
    <p data-game-error hidden role="alert"></p>
  </main>
  <script src="./core.js"></script>
  <script src="./view/art.js"></script>
  <script src="./gamekit.js"></script>
  <script src="./app.js"></script>
</body>
</html>
