<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoopJolt Flag Competition Template</title>
<link rel="stylesheet" href="./template.css">
</head>
<body>
<main id="frame" class="frame format-challenge" aria-label="LoopJolt social template">
  <div id="gameplay" class="gameplay"><div class="gameplay-placeholder">REAL GAMEPLAY AREA</div></div>
  <div class="shade"></div>
  <header class="brand"><span>LOOPJOLT</span><b id="series">FLAG CHALLENGE</b></header>
  <section class="hook"><div id="hook">WHICH FLAG CLEARS THIS?</div></section>
  <section id="flags" class="flags"></section>
  <section id="fact" class="fact"><span id="period"></span><b id="progress">48 RINGS</b></section>
  <section id="versus" class="versus" hidden></section>
  <section id="board" class="board" hidden></section>
  <section class="cta"><b id="cta">PICK YOUR FLAG · PLAY RANKED</b><span>SET YOUR BEST. BACK YOUR FLAG.</span></section>
  <footer><span id="truth">REAL GAMEPLAY · REAL BOARD DATA ONLY</span><span>loopjolt</span></footer>
  <div id="previewWarning" class="preview-warning" hidden>LAYOUT PREVIEW · LIVE DATA REQUIRED</div>
</main>
<script src="./template.js"></script>
</body>
</html>
